name: Roboterarm_reduzierte_Leistung_95p
description: 'Dissertation extension: same procedure, but characterized cell parameters
  where available. C_eq,E from C0 and k (90-20 % window, highest measured current),
  ESR from the recursive method M4 (fallback M3, M2, M1, then datasheet) and thermal
  verification with R_th/C_th. Cells without own thermal data use R_th/C_th of the
  characterized 50 F cell scaled to their size (warning). Thermal check for a packed
  module block without forced cooling and with end-of-life ESR (x 2). Selected: 50
  F.'
