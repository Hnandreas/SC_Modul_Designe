name: thesis_characterized
description: >-
  Dissertation extension: same procedure, but characterized cell parameters where available.
  C_eq,E from C0 and k (90-20 % window, highest measured current), ESR from the recursive method M4
  (fallback M3, M2, M1, then datasheet) and thermal verification with R_th/C_th. Cells without own
  thermal data use the database proxy (marked with a warning).
profile:
  path: data/profiles/private/robot_arm_profile.npz
  scale: 1.0
manual_load:
  use: if_no_profile
  P_peak_W: 2643.0
  P_avg_W: 392.3
  E_dch_J: 1214.1
  E_ch_J: 557.0
split:
  name: moving_average
  params: {window_s: 20.0, alignment: legacy_matlab}
braking: {enabled: true, mode: kinematic, mass_kg: 880.0, v_mps: 1.5, t_brake_s: 1.0}
req:
  U_bus_V: 48.0
  U_C0max_V: 48.0
  P_max_mode: peak
  I_C0max_A: 77.7
  U_C0min_override_V: 33.0
  T_cell_C: 65.0
  t_life_h: 40000.0
  L_EOL: 0.7
  T_amb_C: 25.0
  dT_max_K: 40.0
opt:
  energy_method: zero_crossing_legacy
  scenarios: [profile, profile_braking]
  c_source: ceq_M1
  cfit_range: "90-20"
  cfit_current: highest
  cfit_dataset: auto
  esr_source: measured
  esr_methods: [M4, M3, M2, M1]
  esr_current: highest
  geometry: corrected
  thermal_mode: proxy
  thermal_current: energy_balance
  thermal_profile: periodic
selected:
  profile_braking: {cell_id: VISHAY_HVR235_30F}
